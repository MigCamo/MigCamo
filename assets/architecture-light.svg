<title id="title">Cómo abordo un sistema: frontend, APIs, dominio y datos</title>
<desc id="description">Esquema conceptual de mi enfoque full stack: interfaces, servicios, responsabilidades del dominio y persistencia. Calidad transversal con Cypress y herramientas de desarrollo. No describe la implementación de un proyecto concreto.</desc>
